name: Maven Publish

# Reusable workflow: deploy a Maven project to GitHub Packages.
# On a `release` event the project version is set from the tag (`v1.2.3` -> `1.2.3`).

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to build with.
        type: string
        default: '21'
      version-properties:
        description: >-
          Space-separated POM properties to also set to the release version (e.g. `kotake.version`),
          for versions that must be literal instead of `${project.version}`.
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java ${{ inputs.java-version }} with GitHub Packages
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Select Maven command
        run: |
          if [ -f mvnw ]; then chmod +x mvnw; echo "MVN=./mvnw" >> "$GITHUB_ENV"; else echo "MVN=mvn" >> "$GITHUB_ENV"; fi

      - name: Set version from tag
        if: github.event_name == 'release'
        run: |
          VERSION="${TAG#v}"
          $MVN versions:set -DnewVersion="$VERSION" -DprocessAllModules=true --no-transfer-progress
          for PROP in $VERSION_PROPERTIES; do
            $MVN versions:set-property -Dproperty="$PROP" -DnewVersion="$VERSION" -DgenerateBackupPoms=false --no-transfer-progress
          done
        env:
          # Passed via env (not inline expressions) to avoid script injection
          TAG: ${{ github.ref_name }}
          VERSION_PROPERTIES: ${{ inputs.version-properties }}
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        run: $MVN deploy -DskipTests --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
